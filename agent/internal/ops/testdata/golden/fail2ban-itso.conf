# Sinh bởi itso-agent (fail2ban.apply). Không sửa tay.
[DEFAULT]
banaction = nftables-multiport
banaction_allports = nftables-allports
ignoreip = 127.0.0.1/8 ::1 10.10.0.0/16 10.20.0.0/16

[sshd]
enabled = true
filter = sshd
port = ssh
backend = systemd
bantime = 3600
findtime = 600
maxretry = 5

[itso-panel]
enabled = true
filter = itso-panel
port = http,https,8443
logpath = /var/log/itso/auth.log
backend = auto
bantime = 1800
findtime = 300
maxretry = 10

[pure-ftpd]
enabled = false
filter = pure-ftpd
port = ftp,ftp-data,ftps,ftps-data
backend = systemd
bantime = 3600
findtime = 600
maxretry = 5
