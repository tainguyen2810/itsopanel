# Sinh bởi itso-agent (nginx.vhost.apply, D-67). Không sửa tay: sẽ bị ghi đè.
# website 01938a06-0002-7000-8000-000006000002 · account lehoa · type php

server {
    listen 80;
    listen [::]:80;
    server_name lehoa.vn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/itso/acme/webroot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    ssl_certificate /etc/itso/certs/01938a0c-0001-7000-8000-00000c000001/fullchain.pem;
    ssl_certificate_key /etc/itso/certs/01938a0c-0001-7000-8000-00000c000001/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:itso_ssl:10m;
    server_name www.lehoa.vn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/itso/acme/webroot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://lehoa.vn$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    ssl_certificate /etc/itso/certs/01938a0c-0001-7000-8000-00000c000001/fullchain.pem;
    ssl_certificate_key /etc/itso/certs/01938a0c-0001-7000-8000-00000c000001/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:itso_ssl:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    server_name lehoa.vn;
    root /home/lehoa/sites/lehoa.vn/public;
    index index.php index.html index.htm;
    access_log /var/log/itso/sites/lehoa/lehoa.vn/access.log;
    error_log /var/log/itso/sites/lehoa/lehoa.vn/error.log warn;
    client_max_body_size 64m;
    disable_symlinks if_not_owner from=$document_root;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/itso/acme/webroot;
        default_type text/plain;
        try_files $uri =404;
    }
    location ~ /\.(?!well-known/) {
        deny all;
    }
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/itso/php/lehoa-01938a06.sock;
    }
}
