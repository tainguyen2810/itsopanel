# Sinh bởi itso-agent (nginx.vhost.apply, D-67). Không sửa tay: sẽ bị ghi đè.
# website 01938a06-0002-7000-8000-000006000002 · account lehoa · type php · SUSPENDED

server {
    listen 80;
    listen [::]:80;
    server_name lehoa.vn lehoa.com.vn;
    root /home/lehoa/sites/lehoa.vn/public;
    index index.php index.html index.htm;
    access_log /var/log/itso/sites/lehoa/lehoa.vn/access.log;
    error_log /var/log/itso/sites/lehoa/lehoa.vn/error.log warn;
    client_max_body_size 64m;
    disable_symlinks if_not_owner from=$document_root;
    include /etc/itso/waf/01938a06-0002-7000-8000-000006000002.nginx*;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/itso/acme/webroot;
        default_type text/plain;
        try_files $uri =404;
    }
    error_page 503 /itso-suspended.html;
    location = /itso-suspended.html {
        root /var/lib/itso/suspended;
        internal;
    }
    location / {
        return 503;
    }
}
