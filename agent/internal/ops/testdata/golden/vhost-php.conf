# Sinh bởi itso-agent (nginx.vhost.apply, D-67). Không sửa tay: sẽ bị ghi đè.
# website 01938a06-0002-7000-8000-000006000002 · account lehoa · type php

server {
    listen 80;
    listen [::]:80;
    server_name www.lehoa.vn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/itso/acme/webroot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 http://lehoa.vn$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name lehoa.vn;
    root /home/lehoa/sites/lehoa.vn/public;
    index index.php index.html index.htm;
    access_log /var/log/itso/sites/lehoa/lehoa.vn/access.log;
    error_log /var/log/itso/sites/lehoa/lehoa.vn/error.log warn;
    client_max_body_size 128m;
    disable_symlinks if_not_owner from=$document_root;
    add_header Referrer-Policy "strict-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/itso/acme/webroot;
        default_type text/plain;
        try_files $uri =404;
    }
    location ~ /\.(?!well-known/) {
        deny all;
    }
    location = /old-shop {
        return 301 https://lehoa.vn/shop;
    }
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/itso/php/lehoa-01938a06.sock;
    }
}
