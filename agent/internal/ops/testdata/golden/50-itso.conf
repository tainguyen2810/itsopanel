# Sinh bởi itso-agent (sshd.match.apply). Không sửa tay.
DenyGroups itso-suspended

Match Group itso-sftp
	ChrootDirectory %h
	ForceCommand internal-sftp -d /
	AllowTcpForwarding no
	X11Forwarding no
	PermitTunnel no
	AllowAgentForwarding no

Match Group itso-ssh
	AllowTcpForwarding no
	X11Forwarding no
	PermitTunnel no

Match Group itso-sftp,itso-ssh
	AuthorizedKeysFile /etc/ssh/itso_authorized_keys/%u
	PasswordAuthentication yes

Match all
