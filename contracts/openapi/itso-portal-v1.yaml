# SINH TỰ ĐỘNG bởi contracts/tools/gen_openapi.py (make contracts). Không sửa tay.
openapi: 3.1.0
info:
  title: ITSO Panel Portal API
  version: 1.0.0-p1
  description: 'Portal API cho User Hosting Portal (USER). Public qua Internet: session cookie + CSRF, rate limit, CAPTCHA
    sau nhiều lần đăng nhập sai. Mọi truy vấn bị giới hạn trong tài nguyên của chính người dùng; truy cập tài nguyên ngoài
    phạm vi trả `404`.'
  license:
    name: Proprietary — ITSO
    identifier: LicenseRef-ITSO
servers:
- url: https://portal.itso.local
  description: Origin portal
security:
- portalSession: []
  csrfToken: []
tags:
- name: Accounts
  description: Accounts
- name: Auth
  description: Auth
- name: Backups
  description: Backups
- name: Cron
  description: Cron
- name: Databases
  description: Databases
- name: Files
  description: Files
- name: Git
  description: Git
- name: Jobs
  description: Jobs
- name: Notifications
  description: Notifications
- name: Overview
  description: Overview
- name: Profile
  description: Profile
- name: SFTP
  description: SFTP
- name: SSL
  description: SSL
- name: System
  description: System
- name: Terminal
  description: Terminal
- name: Websites
  description: Websites
- name: WordPress
  description: WordPress
paths:
  /api/v1/auth/csrf:
    get:
      operationId: getCsrfCookie
      summary: Lấy cookie XSRF-TOKEN
      tags:
      - Auth
      responses:
        '204':
          description: Thành công, không có nội dung
        '429':
          $ref: ./common.yaml#/components/responses/TooManyRequests
      security: []
      parameters:
      - $ref: ./common.yaml#/components/parameters/Realm
  /api/v1/auth/impersonation:accept:
    post:
      operationId: acceptImpersonation
      summary: Nhận phiên giả danh từ Admin (vé dùng một lần)
      tags:
      - Auth
      description: Vé do `POST /api/v1/admin/users/{id}:impersonate` tạo, hết hạn sau 60 giây, dùng một lần. Phiên giả danh
        không đổi được mật khẩu/MFA và tự hết hạn theo `expires_at`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ticket:
                  type: string
                  minLength: 32
                  maxLength: 200
              required:
              - ticket
              additionalProperties: false
            example:
              ticket: q7Yb2kV9xW4mN8pR3tL6sD1fG5hJ0aZcE2uI7oP9
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: ./common.yaml#/components/schemas/Me
                required:
                - data
              example:
                data:
                  user:
                    uuid: 01938a01-0003-7000-8000-000001000003
                    realm: portal
                    name: Công ty An Phát
                    email: it@anphat.vn
                    role: USER
                    status: active
                    mfa_enabled: true
                    locale: vi
                    timezone: Asia/Ho_Chi_Minh
                    last_login_at: '2026-11-20T08:15:00+07:00'
                    created_at: '2026-11-18T09:30:00+07:00'
                    updated_at: '2026-11-19T14:05:00+07:00'
                  permissions:
                  - own.*
                  scopes: []
                  mfa_verified_at: '2026-11-20T08:15:00+07:00'
                  impersonating:
                    uuid: 01938a01-0001-7000-8000-000001000001
                    name: Quản trị hệ thống
                    email: superadmin@itso.local
        '429':
          $ref: ./common.yaml#/components/responses/TooManyRequests
        '422':
          $ref: ./common.yaml#/components/responses/ValidationFailed
      security:
      - csrfToken: []
      parameters:
      - $ref: ./common.yaml#/components/parameters/Realm
  /api/v1/auth/impersonation:end:
    post:
      operationId: endImpersonation
      summary: Kết thúc giả danh
      tags:
      - Auth
      responses:
        '204':
          description: Thành công, không có nội dung
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '429':
          $ref: ./common.yaml#/components/responses/TooManyRequests
        '422':
          $ref: ./common.yaml#/components/responses/ValidationFailed
        '409':
          $ref: ./common.yaml#/components/responses/Conflict
      parameters:
      - $ref: ./common.yaml#/components/parameters/Realm
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Đăng nhập (realm theo origin)
      tags:
      - Auth
      description: 'Origin admin chỉ chấp nhận user realm `admin`, origin portal chỉ chấp nhận realm `portal` (một origin:
        theo header `X-ITSO-Realm`, D-58). Sai realm trả cùng lỗi như sai mật khẩu.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./common.yaml#/components/schemas/LoginRequest
            example:
              email: it@anphat.vn
              password: '********'
              remember: false
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: ./common.yaml#/components/schemas/LoginResult
                required:
                - data
              example:
                data:
                  mfa_required: true
                  mfa_methods:
                  - totp
                  - recovery
        '429':
          $ref: ./common.yaml#/components/responses/TooManyRequests
        '422':
          $ref: ./common.yaml#/components/responses/ValidationFailed
      security:
      - csrfToken: []
      parameters:
      - $ref: ./common.yaml#/components/parameters/Realm
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Đăng xuất
      tags:
      - Auth
      responses:
        '204':
          description: Thành công, không có nội dung
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '429':
          $ref: ./common.yaml#/components/responses/TooManyRequests
        '422':
          $ref: ./common.yaml#/components/responses/ValidationFailed
        '409':
          $ref: ./common.yaml#/components/responses/Conflict
      parameters:
      - $ref: ./common.yaml#/components/parameters/Realm
  /api/v1/auth/me:
    get:
      operationId: getMe
      summary: Người dùng hiện tại
      tags:
      - Auth
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: ./common.yaml#/components/schemas/Me
                required:
                - data
              example:
                data:
                  user:
                    uuid: 01938a01-0003-7000-8000-000001000003
                    realm: portal
                    name: Công ty An Phát
                    email: it@anphat.vn
                    role: USER
                    status: active
                    mfa_enabled: true
                    locale: vi
                    timezone: Asia/Ho_Chi_Minh
                    last_login_at: '2026-11-20T08:15:00+07:00'
                    created_at: '2026-11-18T09:30:00+07:00'
                    updated_at: '2026-11-19T14:05:00+07:00'
                  permissions:
                  - own.*
                  scopes: []
                  mfa_verified_at: '2026-11-20T08:15:00+07:00'
                  impersonating: null
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '429':
          $ref: ./common.yaml#/components/responses/TooManyRequests
      parameters:
      - $ref: ./common.yaml#/components/parameters/Realm
  /api/v1/auth/mfa/totp:confirm:
    post:
      operationId: confirmTotp
      summary: Xác nhận TOTP
      tags:
      - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./common.yaml#/components/schemas/MfaVerifyRequest
            example:
              code: '730115'
              method: totp
      responses:
        '204':
          description: Thành công, không có nội dung
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '429':
          $ref: ./common.yaml#/components/responses/TooManyRequests
        '422':
          $ref: ./common.yaml#/components/responses/ValidationFailed
        '409':
          $ref: ./common.yaml#/components/responses/Conflict
      parameters:
      - $ref: ./common.yaml#/components/parameters/Realm
  /api/v1/auth/mfa/totp:enroll:
    post:
      operationId: enrollTotp
      summary: Bắt đầu đăng ký TOTP
      tags:
      - Auth
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: ./common.yaml#/components/schemas/TotpEnrollment
                required:
                - data
              example:
                data:
                  secret: JBSWY3DPEHPK3PXP
                  otpauth_uri: otpauth://totp/ITSO:it%40anphat.vn?secret=JBSWY3DPEHPK3PXP&issuer=ITSO
                  recovery_codes:
                  - k7f2m9q4x1
                  - p3n8v6c2z5
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '429':
          $ref: ./common.yaml#/components/responses/TooManyRequests
        '422':
          $ref: ./common.yaml#/components/responses/ValidationFailed
        '409':
          $ref: ./common.yaml#/components/responses/Conflict
      parameters:
      - $ref: ./common.yaml#/components/parameters/Realm
  /api/v1/auth/mfa/verify:
    post:
      operationId: verifyMfa
      summary: Xác minh MFA sau đăng nhập
      tags:
      - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./common.yaml#/components/schemas/MfaVerifyRequest
            example:
              code: '492817'
              method: totp
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: ./common.yaml#/components/schemas/Me
                required:
                - data
              example:
                data:
                  user:
                    uuid: 01938a01-0003-7000-8000-000001000003
                    realm: portal
                    name: Công ty An Phát
                    email: it@anphat.vn
                    role: USER
                    status: active
                    mfa_enabled: true
                    locale: vi
                    timezone: Asia/Ho_Chi_Minh
                    last_login_at: '2026-11-20T08:15:00+07:00'
                    created_at: '2026-11-18T09:30:00+07:00'
                    updated_at: '2026-11-19T14:05:00+07:00'
                  permissions:
                  - own.*
                  scopes: []
                  mfa_verified_at: '2026-11-20T08:15:00+07:00'
                  impersonating: null
        '429':
          $ref: ./common.yaml#/components/responses/TooManyRequests
        '422':
          $ref: ./common.yaml#/components/responses/ValidationFailed
      security:
      - csrfToken: []
      parameters:
      - $ref: ./common.yaml#/components/parameters/Realm
  /api/v1/auth/password:change:
    post:
      operationId: changePassword
      summary: Đổi mật khẩu
      tags:
      - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./common.yaml#/components/schemas/PasswordChange
            example:
              current_password: '********'
              new_password: '************'
      responses:
        '204':
          description: Thành công, không có nội dung
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '429':
          $ref: ./common.yaml#/components/responses/TooManyRequests
        '422':
          $ref: ./common.yaml#/components/responses/ValidationFailed
        '409':
          $ref: ./common.yaml#/components/responses/Conflict
      parameters:
      - $ref: ./common.yaml#/components/parameters/Realm
  /api/v1/auth/password:forgot:
    post:
      operationId: forgotPassword
      summary: Gửi email đặt lại mật khẩu
      tags:
      - Auth
      description: Luôn trả 204 dù email có tồn tại hay không (không lộ tài khoản).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
              - email
              additionalProperties: false
            example:
              email: it@anphat.vn
      responses:
        '204':
          description: Thành công, không có nội dung
        '429':
          $ref: ./common.yaml#/components/responses/TooManyRequests
        '422':
          $ref: ./common.yaml#/components/responses/ValidationFailed
      security:
      - csrfToken: []
      parameters:
      - $ref: ./common.yaml#/components/parameters/Realm
  /api/v1/auth/password:reset:
    post:
      operationId: resetPassword
      summary: Đặt lại mật khẩu bằng token
      tags:
      - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  minLength: 32
                  maxLength: 200
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 12
                  maxLength: 200
                  writeOnly: true
              required:
              - token
              - email
              - password
              additionalProperties: false
            example:
              token: 8f1c2a7b9e3d4f6a0b5c8d2e7f1a3b6c9d0e4f7a
              email: it@anphat.vn
              password: '************'
      responses:
        '204':
          description: Thành công, không có nội dung
        '429':
          $ref: ./common.yaml#/components/responses/TooManyRequests
        '422':
          $ref: ./common.yaml#/components/responses/ValidationFailed
      security:
      - csrfToken: []
      parameters:
      - $ref: ./common.yaml#/components/parameters/Realm
  /api/v1/auth/sessions:
    get:
      operationId: listSessions
      summary: Phiên đăng nhập của tôi
      tags:
      - Auth
      parameters:
      - $ref: ./common.yaml#/components/parameters/Cursor
      - $ref: ./common.yaml#/components/parameters/Limit
      - $ref: ./common.yaml#/components/parameters/Sort
      - $ref: ./common.yaml#/components/parameters/Q
      - $ref: ./common.yaml#/components/parameters/Realm
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                - $ref: ./common.yaml#/components/schemas/CursorPage
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: ./common.yaml#/components/schemas/Session
                  required:
                  - data
              example:
                data:
                - uuid: 01938a23-0001-7000-8000-000023000001
                  ip: 10.10.5.20
                  user_agent: Firefox 132 / Ubuntu
                  current: true
                  last_active_at: '2026-11-20T08:15:00+07:00'
                  created_at: '2026-11-20T08:15:00+07:00'
                - uuid: 01938a23-0002-7000-8000-000023000002
                  ip: 10.10.5.31
                  user_agent: Chrome 131 / Windows
                  current: false
                  last_active_at: '2026-11-19T14:05:00+07:00'
                  created_at: '2026-11-19T14:05:00+07:00'
                meta:
                  next_cursor: null
                  limit: 50
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '429':
          $ref: ./common.yaml#/components/responses/TooManyRequests
        '422':
          $ref: ./common.yaml#/components/responses/ValidationFailed
  /api/v1/auth/sessions/{id}:
    delete:
      operationId: revokeSession
      summary: Thu hồi phiên
      tags:
      - Auth
      parameters:
      - $ref: ./common.yaml#/components/parameters/Id
      - $ref: ./common.yaml#/components/parameters/Realm
      responses:
        '204':
          description: Thành công, không có nội dung
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '429':
          $ref: ./common.yaml#/components/responses/TooManyRequests
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
        '409':
          $ref: ./common.yaml#/components/responses/Conflict
  /api/v1/auth/step-up:
    post:
      operationId: stepUp
      summary: Xác thực lại MFA cho thao tác nguy hiểm
      tags:
      - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./common.yaml#/components/schemas/MfaVerifyRequest
            example:
              code: '118204'
              method: totp
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: ./common.yaml#/components/schemas/Me
                required:
                - data
              example:
                data:
                  user:
                    uuid: 01938a01-0003-7000-8000-000001000003
                    realm: portal
                    name: Công ty An Phát
                    email: it@anphat.vn
                    role: USER
                    status: active
                    mfa_enabled: true
                    locale: vi
                    timezone: Asia/Ho_Chi_Minh
                    last_login_at: '2026-11-20T08:15:00+07:00'
                    created_at: '2026-11-18T09:30:00+07:00'
                    updated_at: '2026-11-19T14:05:00+07:00'
                  permissions:
                  - own.*
                  scopes: []
                  mfa_verified_at: '2026-11-20T08:15:00+07:00'
                  impersonating: null
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '429':
          $ref: ./common.yaml#/components/responses/TooManyRequests
        '422':
          $ref: ./common.yaml#/components/responses/ValidationFailed
        '409':
          $ref: ./common.yaml#/components/responses/Conflict
      parameters:
      - $ref: ./common.yaml#/components/parameters/Realm
  /api/v1/portal/backup-snapshots:
    get:
      operationId: portalListBackupSnapshots
      summary: Bản backup
      tags:
      - Backups
      parameters:
      - $ref: ./common.yaml#/components/parameters/Cursor
      - $ref: ./common.yaml#/components/parameters/Limit
      - $ref: ./common.yaml#/components/parameters/Sort
      - $ref: ./common.yaml#/components/parameters/Q
      - $ref: ./common.yaml#/components/parameters/FilterHostingAccount
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                - $ref: ./common.yaml#/components/schemas/CursorPage
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: ./common.yaml#/components/schemas/BackupSnapshot
                  required:
                  - data
              example:
                data:
                - uuid: 01938a0e-0001-7000-8000-00000e000001
                  hosting_account:
                    uuid: 01938a05-0001-7000-8000-000005000001
                    username: anphat
                  destination:
                    uuid: 01938a17-0002-7000-8000-000017000002
                    name: S3 Object Lock (offsite)
                  scope_type: hosting_account
                  restic_snapshot_id: 4f2a9c1e
                  size_mb: 12800.4
                  taken_at: '2026-11-20T01:12:00+07:00'
                  verified_at: '2026-11-20T03:00:00+07:00'
                  contents:
                  - files
                  - databases
                  - config
                  tags:
                  - daily
                meta:
                  next_cursor: null
                  limit: 50
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '429':
          $ref: ./common.yaml#/components/responses/TooManyRequests
        '422':
          $ref: ./common.yaml#/components/responses/ValidationFailed
  /api/v1/portal/backup-snapshots/{id}/browse:
    get:
      operationId: portalBrowseBackupSnapshot
      summary: Duyệt file trong snapshot
      tags:
      - Backups
      parameters:
      - $ref: ./common.yaml#/components/parameters/Cursor
      - $ref: ./common.yaml#/components/parameters/Limit
      - $ref: ./common.yaml#/components/parameters/Sort
      - $ref: ./common.yaml#/components/parameters/Q
      - $ref: ./common.yaml#/components/parameters/Id
      - $ref: ./common.yaml#/components/parameters/PathQuery
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                - $ref: ./common.yaml#/components/schemas/CursorPage
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: ./common.yaml#/components/schemas/FileEntry
                  required:
                  - data
              example:
                data:
                - name: public
                  path: sites/anphat.vn/public
                  type: dir
                  size: 4096
                  mode: '0750'
                  owner: anphat
                  modified_at: '2026-11-19T14:05:00+07:00'
                - name: index.php
                  path: sites/anphat.vn/public/index.php
                  type: file
                  size: 1734
                  mode: '0640'
                  owner: anphat
                  modified_at: '2026-11-19T14:05:00+07:00'
                meta:
                  next_cursor: null
                  limit: 50
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '429':
          $ref: ./common.yaml#/components/responses/TooManyRequests
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
        '422':
          $ref: ./common.yaml#/components/responses/ValidationFailed
  /api/v1/portal/backup-snapshots/{id}:download-link:
    post:
      operationId: portalBackupDownloadLink
      summary: Link tải bản backup
      tags:
      - Backups
      parameters:
      - $ref: ./common.yaml#/components/parameters/Id
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: ./common.yaml#/components/schemas/SignedUrl
                required:
                - data
              example:
                data:
                  url: https://portal.itso.local/dl/backup/4f2a9c1e.tar.zst?sig=abc
                  expires_at: '2026-11-20T09:15:00+07:00'
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '429':
          $ref: ./common.yaml#/components/responses/TooManyRequests
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
        '422':
