  /api/v1/auth/sessions/{id}:
    delete:
      operationId: revokeSession
      summary: Thu hồi phiên
      tags:
      - Auth
      parameters:
      - $ref: ./common.yaml#/components/parameters/Id
      - $ref: ./common.yaml#/components/parameters/Realm
      responses:
        '204':
          description: Thành công, không có nội dung
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '429':
          $ref: ./common.yaml#/components/responses/TooManyRequests
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
        '409':
          $ref: ./common.yaml#/components/responses/Conflict
  /api/v1/auth/step-up:
    post:
      operationId: stepUp
      summary: Xác thực lại MFA cho thao tác nguy hiểm
      tags:
      - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./common.yaml#/components/schemas/MfaVerifyRequest
            example:
              code: '118204'
              method: totp
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: ./common.yaml#/components/schemas/Me
                required:
                - data
              example:
                data:
                  user:
                    uuid: 01938a01-0001-7000-8000-000001000001
                    realm: admin
                    name: Quản trị hệ thống
                    email: superadmin@itso.local
                    role: SUPER_ADMIN
                    status: active
                    mfa_enabled: true
                    locale: vi
                    timezone: Asia/Ho_Chi_Minh
                    last_login_at: '2026-11-20T08:15:00+07:00'
                    created_at: '2026-11-18T09:30:00+07:00'
                    updated_at: '2026-11-19T14:05:00+07:00'
                  permissions:
                  - '*'
                  scopes: []
                  mfa_verified_at: '2026-11-20T08:15:00+07:00'
                  impersonating: null
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '429':
          $ref: ./common.yaml#/components/responses/TooManyRequests
        '422':
          $ref: ./common.yaml#/components/responses/ValidationFailed
        '409':
          $ref: ./common.yaml#/components/responses/Conflict
      parameters:
      - $ref: ./common.yaml#/components/parameters/Realm
  /api/v1/system/health:
    get:
      operationId: getHealth
      summary: Kiểm tra sống
      tags:
      - System
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: ./common.yaml#/components/schemas/Health
                required:
                - data
              example:
                data:
                  status: ok
        '429':
          $ref: ./common.yaml#/components/responses/TooManyRequests
      security: []
components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: itso_admin_session
      description: Session realm admin (D-58), cookie Secure; HttpOnly; SameSite=Strict.
    portalSession:
      type: apiKey
      in: cookie
      name: itso_portal_session
      description: Session realm portal (D-58), cookie Secure; HttpOnly; SameSite=Strict.
    csrfToken:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: Giá trị cookie XSRF-TOKEN, bắt buộc cho request thay đổi trạng thái.
    bearerToken:
      type: http
      scheme: bearer
      description: API token nội bộ có scope (CLI `itso`, automation). Chỉ Admin API.
