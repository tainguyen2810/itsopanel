paths:
  /api/v1/admin/account-migrations:
    get:
      operationId: listAccountMigrations
      summary: Phiên chuyển server
      tags:
      - Migrations
      parameters:
      - $ref: ./common.yaml#/components/parameters/Cursor
      - $ref: ./common.yaml#/components/parameters/Limit
      - $ref: ./common.yaml#/components/parameters/Sort
      - $ref: ./common.yaml#/components/parameters/Q
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                - $ref: ./common.yaml#/components/schemas/CursorPage
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/AccountMigration'
                  required:
                  - data
              example:
                data:
                - uuid: 01938a15-0001-7000-8000-000015000001
                  hosting_account:
                    uuid: 01938a05-0003-7000-8000-000005000003
                    username: lehoa
                  source_server:
                    uuid: 01938a02-0003-7000-8000-000002000003
                    name: srv-hcm-01
                  target_server:
                    uuid: 01938a02-0002-7000-8000-000002000002
                    name: srv-hn-02
                  state: verifying
                  bytes_synced: 2201000000
                  downtime_sec: null
                  verification:
                    files:
                      checked: 50300
                      mismatched: 0
                    databases:
                      lehoa_wp: checksum khớp
                    ssl: đã sao chép
                    cron: 0 job
                    ownership: đã chown theo UID 20004
                  job_uuid: 01938a0f-0003-7000-8000-00000f000003
                  requested_by:
                    uuid: 01938a01-0001-7000-8000-000001000001
                    name: Quản trị hệ thống
                    email: superadmin@itso.local
                  cleanup_after: null
                  created_at: '2026-11-18T09:30:00+07:00'
                  updated_at: '2026-11-19T14:05:00+07:00'
                meta:
                  next_cursor: null
                  limit: 50
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '429':
          $ref: ./common.yaml#/components/responses/TooManyRequests
        '422':
          $ref: ./common.yaml#/components/responses/ValidationFailed
  /api/v1/admin/account-migrations/{id}:
    get:
      operationId: getAccountMigration
      summary: Chi tiết phiên chuyển
      tags:
      - Migrations
      parameters:
      - $ref: ./common.yaml#/components/parameters/Id
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AccountMigration'
                required:
                - data
              example:
                data:
                  uuid: 01938a15-0001-7000-8000-000015000001
                  hosting_account:
                    uuid: 01938a05-0003-7000-8000-000005000003
                    username: lehoa
                  source_server:
                    uuid: 01938a02-0003-7000-8000-000002000003
                    name: srv-hcm-01
                  target_server:
                    uuid: 01938a02-0002-7000-8000-000002000002
                    name: srv-hn-02
                  state: verifying
                  bytes_synced: 2201000000
                  downtime_sec: null
                  verification:
                    files:
                      checked: 50300
                      mismatched: 0
                    databases:
                      lehoa_wp: checksum khớp
                    ssl: đã sao chép
                    cron: 0 job
                    ownership: đã chown theo UID 20004
                  job_uuid: 01938a0f-0003-7000-8000-00000f000003
                  requested_by:
                    uuid: 01938a01-0001-7000-8000-000001000001
