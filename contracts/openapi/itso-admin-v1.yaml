    UserUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
        locale:
          type: string
          enum:
          - vi
          - en
        role:
          type: string
          enum:
          - SUPER_ADMIN
          - ADMIN
          - USER
