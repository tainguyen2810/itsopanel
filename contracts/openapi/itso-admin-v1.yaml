  /api/v1/admin/account-migrations/{id}:cutover:
    post:
      operationId: cutoverAccountMigration
      summary: Cutover (chỉ khi verifying khớp)
      tags:
      - Migrations
      x-itso-step-up: true
      description: 'Yêu cầu step-up MFA (xác thực lại trong 10 phút), nếu không trả 403 `mfa_step_up_required`.


        Thao tác bất đồng bộ: trả `202` kèm Job; bắt buộc header `Idempotency-Key`.'
      parameters:
      - $ref: ./common.yaml#/components/parameters/Id
      - $ref: ./common.yaml#/components/parameters/IdempotencyKey
      responses:
        '202':
          description: Đã nhận, Job được tạo
          content:
            application/json:
              schema:
                $ref: ./common.yaml#/components/schemas/JobAccepted
              example:
                job:
                  uuid: 01938a0f-0075-7000-8000-00000f000075
                  type: migration.cutover
                  state: queued
                  progress: 0
                  resource:
                    type: account_migration
                    uuid: 01938a15-0001-7000-8000-000015000001
                  steps:
                  - seq: 1
                    op: migrate.cutover
                    state: pending
                    started_at: null
                    finished_at: null
                  attempts: 0
                  max_attempts: 3
                  timeout_sec: 600
                  error: null
                  server:
                    uuid: 01938a02-0003-7000-8000-000002000003
                    name: srv-hcm-01
                  requested_by:
                    uuid: 01938a01-0001-7000-8000-000001000001
                    name: Quản trị hệ thống
                    email: superadmin@itso.local
                  created_at: '2026-11-20T08:15:00+07:00'
                  started_at: null
                  finished_at: null
                  links:
                    self: /api/v1/admin/jobs/01938a0f-0075-7000-8000-00000f000075
                    events: /api/v1/admin/jobs/01938a0f-0075-7000-8000-00000f000075/events
                resource:
                  type: account_migration
                  uuid: 01938a15-0001-7000-8000-000015000001
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '429':
          $ref: ./common.yaml#/components/responses/TooManyRequests
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
        '422':
          $ref: ./common.yaml#/components/responses/ValidationFailed
        '409':
          $ref: ./common.yaml#/components/responses/Conflict
  /api/v1/admin/account-migrations/{id}:rollback:
    post:
      operationId: rollbackAccountMigration
      summary: Hoàn tác về server nguồn
      tags:
      - Migrations
      description: 'Thao tác bất đồng bộ: trả `202` kèm Job; bắt buộc header `Idempotency-Key`.'
      parameters:
      - $ref: ./common.yaml#/components/parameters/Id
      - $ref: ./common.yaml#/components/parameters/IdempotencyKey
      responses:
        '202':
          description: Đã nhận, Job được tạo
