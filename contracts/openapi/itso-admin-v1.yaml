          - locked
          - disabled
        mfa_enabled:
          type: boolean
        locale:
          type: string
          enum:
          - vi
          - en
        timezone:
          type: string
        last_login_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - uuid
      - realm
      - name
      - email
      - role
      - status
      - mfa_enabled
      - locale
      - timezone
      - last_login_at
      - created_at
      - updated_at
      additionalProperties: false
    UserCreate:
      type: object
      properties:
        realm:
          type: string
          enum:
          - admin
          - portal
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - SUPER_ADMIN
          - ADMIN
          - USER
