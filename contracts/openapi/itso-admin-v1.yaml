openapi: 3.1.0
info:
  title: ITSO Panel Admin API
  version: 1.0.0-p1
  description: 'Admin API cho Private Admin Panel (SUPER_ADMIN, ADMIN) và CLI `itso` (API token). Chỉ truy cập từ origin admin
    + IP allowlist; MFA bắt buộc; step-up cho thao tác nguy hiểm. Mọi thao tác chạm Linux trả `202` + Job. Public Provisioning
    API: DEFERRED, không có trong contract này.'
  license:
    name: Proprietary — ITSO
    identifier: LicenseRef-ITSO
servers:
- url: https://admin.itso.local
  description: Origin admin
security:
- adminSession: []
  csrfToken: []
- bearerToken: []
