# SINH TỰ ĐỘNG bởi contracts/tools/gen_openapi.py (make contracts). Không sửa tay.
openapi: 3.1.0
info:
  title: ITSO Panel — components chung
  version: 1.0.0-p1
  license:
    name: Proprietary — ITSO
    identifier: LicenseRef-ITSO
servers:
- url: https://admin.itso.local
paths: {}
components:
  schemas:
    Uuid:
      type: string
      format: uuid
    Domain:
      type: string
      minLength: 4
      maxLength: 253
      pattern: ^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+(xn--[a-z0-9-]{1,59}|[a-z]{2,63})$
      description: 'Tên miền chữ thường, đã chuyển punycode. Kiểm thêm ở tầng nghiệp vụ: cấm localhost, IP, tên panel.'
    Username:
      type: string
      pattern: ^[a-z][a-z0-9]{2,15}$
      not:
        enum:
        - root
        - admin
        - www
        - mysql
        - postgres
        - redis
        - nginx
        - itso
        - daemon
        - bin
        - sys
        - sync
        - games
        - man
        - mail
        - news
        - proxy
        - backup
        - list
        - nobody
        - systemd
        - sshd
        - ftp
        - test
        - user
        - support
      description: Username Linux của hosting account.
    RelPath:
      type: string
      maxLength: 4096
      oneOf:
      - const: .
      - pattern: ^[^/\x00-\x1f]+(/[^/\x00-\x1f]+)*$
        not:
          pattern: (^|/)\.{1,2}(/|$)
      description: Đường dẫn TƯƠNG ĐỐI với home của account. `.` là thư mục gốc. Cấm `..`, ký tự điều khiển, đường dẫn tuyệt
        đối.
    DbName:
      type: string
      pattern: ^[a-z][a-z0-9_]{0,63}$
      description: Tên database/DB user. Tầng nghiệp vụ bắt buộc tiền tố `<username>_`.
    CronExpr:
      type: string
      maxLength: 100
      pattern: ^([0-9*,/-]+) ([0-9*,/-]+) ([0-9*,/-]+) ([0-9*,/-]+) ([0-9*,/-]+)$
      description: Biểu thức cron 5 trường dạng số. Khoảng tối thiểu theo gói kiểm ở tầng nghiệp vụ.
    CronCommand:
      type: string
      minLength: 1
      maxLength: 1024
      not:
        pattern: '[\r\n\x00]'
      description: Lệnh chạy dưới UID của account. Một dòng, không ký tự xuống dòng (chống chèn crontab).
    NginxSize:
      type: string
      pattern: ^[0-9]{1,5}[kmg]?$
      description: Giá trị kích thước Nginx, ví dụ 64m.
    HeaderValue:
      type: string
      maxLength: 512
      not:
        pattern: '[;{}\r\n\x00"''\\$]'
      description: 'Giá trị đưa vào cấu hình Nginx: cấm ký tự phá cú pháp.'
    PhpVersion:
      type: string
      pattern: ^[5-9]\.[0-9]$
    Cidr:
      type: string
      pattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}(/([0-9]|[12][0-9]|3[0-2]))?$|^[0-9a-f:]+(/[0-9]{1,3})?$
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        code:
          $ref: '#/components/schemas/ErrorCode'
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
      - type
      - title
      - status
      - code
      additionalProperties: false
      description: RFC 9457 Problem Details.
    ErrorCode:
      type: string
      enum:
      - bad_request
      - unauthenticated
      - forbidden
      - not_found
      - conflict
      - idempotency_key_reused
      - precondition_failed
      - validation_failed
      - rate_limited
      - mfa_required
      - mfa_step_up_required
      - ip_not_allowed
      - csrf_mismatch
      - quota_exceeded
      - package_limit_reached
      - resource_locked
      - invalid_state_transition
      - server_not_accepting
      - agent_unavailable
      - job_failed
      - legal_hold_active
      - retention_not_elapsed
      - backup_not_verified
      - confirmation_mismatch
      - internal_error
    CursorMeta:
      type: object
      properties:
        next_cursor:
          type:
          - string
          - 'null'
        limit:
          type: integer
          minimum: 1
          maximum: 200
      required:
      - next_cursor
      additionalProperties: false
    CursorPage:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/CursorMeta'
      required:
      - meta
    ResourceRef:
      type: object
      properties:
        type:
          type: string
        uuid:
          type: string
          format: uuid
      required:
      - type
      - uuid
      additionalProperties: false
    UserRef:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
      required:
      - uuid
      - name
      - email
      additionalProperties: false
    ServerRef:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        name:
          type: string
      required:
      - uuid
      - name
      additionalProperties: false
    AccountRef:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        username:
          $ref: '#/components/schemas/Username'
      required:
      - uuid
      - username
      additionalProperties: false
    WebsiteRef:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        primary_domain:
          $ref: '#/components/schemas/Domain'
      required:
      - uuid
      - primary_domain
      additionalProperties: false
    JobState:
      type: string
      enum:
      - queued
      - running
      - succeeded
      - failed
      - cancel_requested
      - cancelled
      - timed_out
    JobStep:
      type: object
      properties:
        seq:
          type: integer
          minimum: 1
        op:
          type: string
          pattern: ^[a-z0-9]+(\.[a-z0-9_]+)+$
        state:
          type: string
          enum:
          - pending
          - running
          - succeeded
          - failed
          - skipped
          - cancelled
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - seq
      - op
      - state
      - started_at
      - finished_at
      additionalProperties: false
    Job:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        type:
          type: string
          pattern: ^[a-z0-9_]+\.[a-z0-9_.]+$
        state:
          $ref: '#/components/schemas/JobState'
        progress:
          type: integer
          minimum: 0
          maximum: 100
        resource:
          oneOf:
          - $ref: '#/components/schemas/ResourceRef'
          - type: 'null'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/JobStep'
        attempts:
          type: integer
          minimum: 0
        max_attempts:
          type: integer
          minimum: 1
        timeout_sec:
          type: integer
          minimum: 1
        error:
          type:
          - object
          - 'null'
          properties:
            code:
              type: string
            message:
              type: string
            step:
              type:
              - integer
              - 'null'
          required:
          - code
          - message
          - step
          additionalProperties: false
        server:
          oneOf:
          - $ref: '#/components/schemas/ServerRef'
          - type: 'null'
        requested_by:
          oneOf:
          - $ref: '#/components/schemas/UserRef'
          - type: 'null'
        created_at:
          type: string
          format: date-time
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
        links:
          type: object
          properties:
            self:
              type: string
            events:
              type: string
          required:
          - self
          - events
          additionalProperties: false
      required:
      - uuid
      - type
      - state
      - progress
      - resource
      - steps
      - attempts
      - max_attempts
      - timeout_sec
      - error
      - server
      - requested_by
      - created_at
      - started_at
      - finished_at
      - links
      additionalProperties: false
    JobAccepted:
      type: object
      properties:
        job:
          $ref: '#/components/schemas/Job'
        resource:
          oneOf:
          - $ref: '#/components/schemas/ResourceRef'
          - type: 'null'
      required:
      - job
      additionalProperties: false
    JobLog:
      type: object
      properties:
        seq:
          type: integer
        at:
          type: string
          format: date-time
        level:
          type: string
          enum:
          - debug
          - info
          - warn
          - error
        message:
          type: string
      required:
      - seq
      - at
      - level
      - message
      additionalProperties: false
    User:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        realm:
          type: string
          enum:
          - admin
          - portal
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - SUPER_ADMIN
          - ADMIN
          - USER
        status:
          type: string
          enum:
          - active
          - locked
          - disabled
        mfa_enabled:
          type: boolean
        locale:
          type: string
          enum:
          - vi
          - en
        timezone:
          type: string
        last_login_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - uuid
      - realm
      - name
      - email
      - role
      - status
      - mfa_enabled
      - locale
      - timezone
      - last_login_at
      - created_at
      - updated_at
      additionalProperties: false
    Me:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        permissions:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            type: object
            properties:
              scope_type:
                type: string
              uuid:
                type: string
                format: uuid
              name:
                type: string
            required:
            - scope_type
            - uuid
            - name
            additionalProperties: false
        mfa_verified_at:
          type:
          - string
          - 'null'
          format: date-time
        impersonating:
          oneOf:
          - $ref: '#/components/schemas/UserRef'
          - type: 'null'
      required:
      - user
      - permissions
      - scopes
      - mfa_verified_at
      - impersonating
      additionalProperties: false
    Session:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        ip:
          type: string
        user_agent:
          type: string
        current:
          type: boolean
        last_active_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
      required:
      - uuid
      - ip
      - user_agent
      - current
      - last_active_at
      - created_at
      additionalProperties: false
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 200
          writeOnly: true
        remember:
          type: boolean
      required:
      - email
      - password
      additionalProperties: false
    LoginResult:
      type: object
      properties:
        mfa_required:
          type: boolean
        mfa_methods:
          type: array
          items:
            type: string
            enum:
            - totp
            - recovery
      required:
      - mfa_required
      - mfa_methods
      additionalProperties: false
    MfaVerifyRequest:
      type: object
      properties:
        code:
          type: string
          pattern: ^([0-9]{6}|[a-z0-9]{10})$
        method:
          type: string
          enum:
          - totp
          - recovery
      required:
      - code
      - method
      additionalProperties: false
    TotpEnrollment:
      type: object
      properties:
        secret:
          type: string
        otpauth_uri:
          type: string
        recovery_codes:
          type: array
          items:
            type: string
      required:
      - secret
      - otpauth_uri
      - recovery_codes
      additionalProperties: false
    PasswordChange:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          minLength: 12
          writeOnly: true
      required:
      - current_password
      - new_password
      additionalProperties: false
    UsageItem:
      type: object
      properties:
        used:
          type: number
          minimum: 0
        limit:
          type: number
          minimum: 0
      required:
      - used
      - limit
      additionalProperties: false
    AccountFeatures:
      type: object
      properties:
        package:
          $ref: '#/components/schemas/PackageRef'
        php_versions:
          type: array
          items:
            $ref: '#/components/schemas/PhpVersion'
        php_workers_max:
          type: integer
          minimum: 1
        ssh_allowed:
          type: boolean
        cron_min_interval_min:
          type: integer
          minimum: 1
        backup_quota_mb:
          type: integer
          minimum: 0
        backup_retention:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
      required:
      - package
      - php_versions
      - php_workers_max
      - ssh_allowed
      - cron_min_interval_min
      - backup_quota_mb
      - backup_retention
      additionalProperties: false
      description: Tính năng theo phiên bản gói hiện hành của account (đã áp limits_override); tập con an toàn cho Portal
        (D-57).
    Usage:
      type: object
      properties:
        disk_mb:
          $ref: '#/components/schemas/UsageItem'
        inodes:
          $ref: '#/components/schemas/UsageItem'
        cpu_percent:
          $ref: '#/components/schemas/UsageItem'
        ram_mb:
          $ref: '#/components/schemas/UsageItem'
        websites:
          $ref: '#/components/schemas/UsageItem'
        databases:
          $ref: '#/components/schemas/UsageItem'
        ftp_accounts:
          $ref: '#/components/schemas/UsageItem'
        cron_jobs:
          $ref: '#/components/schemas/UsageItem'
        backup_mb:
          $ref: '#/components/schemas/UsageItem'
        bandwidth_mb_30d:
          type: number
          minimum: 0
        measured_at:
          type: string
          format: date-time
      required:
      - disk_mb
      - inodes
      - cpu_percent
      - ram_mb
      - websites
      - databases
      - ftp_accounts
      - cron_jobs
      - backup_mb
      - bandwidth_mb_30d
      - measured_at
      additionalProperties: false
    LifecycleState:
      type: string
      enum:
      - pending
      - provisioning
      - active
      - suspended
      - migrating
      - terminated
      - purged
      - failed
    PackageRef:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        version:
          type: integer
          minimum: 1
      required:
      - uuid
      - code
      - name
      - version
      additionalProperties: false
    HostingAccount:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        username:
          $ref: '#/components/schemas/Username'
        server:
          $ref: '#/components/schemas/ServerRef'
        package:
          $ref: '#/components/schemas/PackageRef'
        owner:
          $ref: '#/components/schemas/UserRef'
        uid:
          type: integer
          minimum: 20000
          maximum: 59999
        home_path:
          type: string
        lifecycle_state:
          $ref: '#/components/schemas/LifecycleState'
        suspended_reason:
          type:
          - string
          - 'null'
        terminated_at:
          type:
          - string
          - 'null'
          format: date-time
        purge_after:
          type:
          - string
          - 'null'
          format: date-time
        legal_hold:
          type: boolean
        usage:
          $ref: '#/components/schemas/Usage'
        status:
          type: string
          enum:
          - pending
          - provisioning
          - ready
          - degraded
          - failed
          - suspended
          - deleting
          description: Trạng thái quan sát được (observed).
        spec_version:
          type: integer
          minimum: 1
          description: 'Desired: tăng mỗi lần đổi cấu hình.'
        observed_version:
          type: integer
          minimum: 0
          description: Phiên bản agent đã áp dụng.
        drift:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
        observed_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - uuid
      - username
      - server
      - package
      - owner
      - uid
      - home_path
      - lifecycle_state
      - suspended_reason
      - terminated_at
      - purge_after
      - legal_hold
      - usage
      - status
      - spec_version
      - observed_version
      - drift
      - observed_at
      - created_at
      - updated_at
      additionalProperties: false
    LifecycleEvent:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        from_state:
          oneOf:
          - $ref: '#/components/schemas/LifecycleState'
          - type: 'null'
        to_state:
          $ref: '#/components/schemas/LifecycleState'
        reason:
          type:
          - string
          - 'null'
        actor:
          oneOf:
          - $ref: '#/components/schemas/UserRef'
          - type: 'null'
        job_uuid:
          type:
          - string
          - 'null'
          format: uuid
        at:
          type: string
          format: date-time
      required:
      - uuid
      - from_state
      - to_state
      - reason
      - actor
      - job_uuid
      - at
      additionalProperties: false
    Website:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        hosting_account:
          $ref: '#/components/schemas/AccountRef'
        server:
          $ref: '#/components/schemas/ServerRef'
        primary_domain:
          $ref: '#/components/schemas/Domain'
        type:
          type: string
          enum:
          - php
          - static
          - proxy
          - docker
        document_root:
          $ref: '#/components/schemas/RelPath'
        php_version:
          oneOf:
          - $ref: '#/components/schemas/PhpVersion'
          - type: 'null'
        ssl_mode:
          type: string
          enum:
          - none
          - acme
          - custom
        waf_enabled:
          type: boolean
        domains_count:
          type: integer
          minimum: 0
        certificate_expires_at:
          type:
          - string
          - 'null'
          format: date-time
        status:
          type: string
          enum:
          - pending
          - provisioning
          - ready
          - degraded
          - failed
          - suspended
          - deleting
          description: Trạng thái quan sát được (observed).
        spec_version:
          type: integer
          minimum: 1
          description: 'Desired: tăng mỗi lần đổi cấu hình.'
        observed_version:
          type: integer
          minimum: 0
          description: Phiên bản agent đã áp dụng.
        drift:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
        observed_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - uuid
      - hosting_account
      - server
      - primary_domain
      - type
      - document_root
      - php_version
      - ssl_mode
      - waf_enabled
      - domains_count
      - certificate_expires_at
      - status
      - spec_version
      - observed_version
      - drift
      - observed_at
      - created_at
      - updated_at
      additionalProperties: false
    WebsiteCreate:
      type: object
      properties:
        hosting_account_uuid:
          type: string
          format: uuid
        primary_domain:
          $ref: '#/components/schemas/Domain'
        type:
          type: string
          enum:
          - php
          - static
          - proxy
        document_root:
          $ref: '#/components/schemas/RelPath'
        php_version:
          oneOf:
          - $ref: '#/components/schemas/PhpVersion'
          - type: 'null'
        ssl_mode:
          type: string
          enum:
          - none
          - acme
        proxy_target:
          type:
          - string
          - 'null'
          pattern: ^http://127\.0\.0\.1:[0-9]{2,5}$
      required:
      - hosting_account_uuid
      - primary_domain
      - type
      additionalProperties: false
    WebsiteUpdate:
      type: object
      properties:
        document_root:
          $ref: '#/components/schemas/RelPath'
        php_version:
          oneOf:
          - $ref: '#/components/schemas/PhpVersion'
          - type: 'null'
        ssl_mode:
          type: string
          enum:
          - none
          - acme
          - custom
        waf_enabled:
          type: boolean
      additionalProperties: false
    WebsiteDomain:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        website:
          $ref: '#/components/schemas/WebsiteRef'
        name:
          $ref: '#/components/schemas/Domain'
        type:
          type: string
          enum:
          - primary
          - alias
          - redirect
          - subdomain
        verified_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - uuid
      - website
      - name
      - type
      - verified_at
      - created_at
      - updated_at
      additionalProperties: false
    WebsiteDomainCreate:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/Domain'
        type:
          type: string
          enum:
          - alias
          - redirect
          - subdomain
      required:
      - name
      - type
      additionalProperties: false
    WebsiteNginx:
      type: object
      properties:
        client_max_body_size:
          $ref: '#/components/schemas/NginxSize'
        http2:
          type: boolean
        hsts:
          type: boolean
        extra_headers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/HeaderValue'
        redirects:
          type: array
          items:
            type: object
            properties:
              from:
                $ref: '#/components/schemas/RelPath'
              to:
                type: string
                format: uri
              code:
                type: string
                enum:
                - '301'
                - '302'
            required:
            - from
            - to
            - code
            additionalProperties: false
      additionalProperties: false
    WebsitePhp:
