            type: https://docs.itso.local/errors/validation_failed
            title: Dữ liệu không hợp lệ
            status: 422
            code: validation_failed
            detail: Một hoặc nhiều trường không hợp lệ.
            request_id: req_01JD8K2M4N
            errors:
