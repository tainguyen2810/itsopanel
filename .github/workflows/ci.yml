# CI ITSO Panel — chạy khi repo được đẩy lên GitHub (xem docs/runbooks/connect-github.md).
# Bản local tương đương: `make check`.
name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  GO_VERSION: "1.24"
  PHP_VERSION: "8.3"
  REDOCLY_TELEMETRY: "off"
  NO_UPDATE_NOTIFIER: "1"

jobs:
  structure:
    name: structure
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: make structure

  docs:
    name: docs (markdownlint, link, mermaid)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: make docs-check

  database:
    name: database (db-verify trên PostgreSQL 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: itso
          POSTGRES_PASSWORD: itso_ci_only
          POSTGRES_DB: itso_verify
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U itso" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_VERIFY_URL: postgresql://itso:itso_ci_only@127.0.0.1:5432/itso_verify
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q postgresql-client
      - run: make db-verify

  contracts:
    name: contracts (lint, examples, codegen-check)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pyyaml
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: agent/go.sum
      - run: corepack enable && corepack pnpm install --frozen-lockfile
      - run: make contracts-check
      - run: make codegen-check

  web:
    name: web (lint, typecheck, vitest, build, playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable && corepack pnpm install --frozen-lockfile
      - name: Lint (tokens, ESLint, Prettier, tsc, i18n)
        run: make lint-web
      - name: Vitest
        run: make test-web
      - name: Build (không chứa /design)
        run: |
          make build-web
          test ! -e apps/web/dist/design
      - name: Build demo (build thường không chứa MSW)
        run: make build-demo
      - name: Cài Chromium cho Playwright
        working-directory: apps/web
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Playwright (ảnh Design System, hành vi shell, axe-core)
        run: make test-e2e
        env:
          CI: "true"
      - name: Lưu ảnh chụp
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-system-screenshots
          path: apps/web/test-results/
          retention-days: 14

  api:
    name: api (pint, larastan, pest + PostgreSQL/Redis, cấm lệnh hệ thống)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: itso
          POSTGRES_PASSWORD: itso_ci_only
          POSTGRES_DB: itso_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U itso" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, pdo_sqlite, redis, curl, mbstring, xml, zip, intl
          coverage: none
          tools: composer:v2
      - name: composer install
        working-directory: apps/api
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: .env cho test
        working-directory: apps/api
        run: cp .env.example .env && php artisan key:generate --ansi
      - name: Pint + PHPStan/Larastan
        run: make lint-api
      - name: Pest (PostgreSQL 16 + Redis 7, D-59)
        run: make test-api
        env:
          DB_PASSWORD: itso_ci_only
      - name: Chặn lệnh hệ thống (exec, shell_exec, proc_open, sh -c…)
        run: make no-exec

  agent:
    name: agent (vet, staticcheck, test -race, fuzz 30s)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: agent/go.sum
      - name: gofmt + go vet
        run: make lint-agent
      - name: staticcheck
        working-directory: agent
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - name: go test -race
        run: make test-agent
      - name: Fuzz parser envelope (30 giây)
        run: make test-fuzz FUZZTIME=30s
